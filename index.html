<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Risc Cardiovascular</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --surface2: #21212b;
    --border: rgba(255,255,255,0.08);
    --text: #f0eff6;
    --muted: #8888a0;
    --accent: #e05c5c;
    --accent2: #f0a86e;
    --green: #4caf7d;
    --yellow: #f0c040;
    --red: #e05c5c;
    --radius: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 64px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 400px;
    background: radial-gradient(ellipse, rgba(224,92,92,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 680px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.7s ease both;
  }
  .header-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.15;
    color: var(--text);
  }
  .header h1 em { font-style: italic; color: var(--accent2); }
  .header p {
    margin-top: 12px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
    max-width: 460px;
    margin-inline: auto;
    line-height: 1.6;
  }

  /* PROGRESS */
  .progress-bar-wrap {
    background: var(--surface);
    border-radius: 99px;
    height: 4px;
    margin-bottom: 36px;
    overflow: hidden;
    animation: fadeIn 0.5s ease both 0.3s;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    text-align: right;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    animation: fadeIn 0.5s ease both 0.3s;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px;
    animation: slideUp 0.45s cubic-bezier(.4,0,.2,1) both;
  }

  .question-number {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .question-text {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(18px, 3vw, 22px);
    line-height: 1.35;
    margin-bottom: 28px;
  }
  .question-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 10px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, transform 0.15s;
    font-size: 14.5px;
    color: var(--text);
    text-align: left;
  }
  .option:hover {
    border-color: rgba(224,92,92,0.4);
    background: rgba(224,92,92,0.07);
    transform: translateX(3px);
  }
  .option.selected {
    border-color: var(--accent);
    background: rgba(224,92,92,0.13);
    color: #fff;
  }
  .option-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--muted);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }
  .option.selected .option-dot {
    border-color: var(--accent);
    background: var(--accent);
  }
  .option.selected .option-dot::after {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #fff;
  }

  /* NAV BUTTONS */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    gap: 12px;
  }
  .btn {
    padding: 11px 26px;
    border-radius: 8px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-back {
    background: transparent;
    color: var(--muted);
    border: 1.5px solid var(--border);
  }
  .btn-back:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }
  .btn-next {
    background: linear-gradient(135deg, var(--accent), #c0404a);
    color: #fff;
    margin-left: auto;
  }
  .btn-next:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-next:not(:disabled):hover { opacity: 0.88; }

  /* RESULTS */
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 40px 36px;
    animation: slideUp 0.5s ease both;
  }

  .risk-display {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }
  .risk-label-top {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .gauge-wrap {
    position: relative;
    width: 200px;
    height: 110px;
    margin-bottom: 20px;
  }
  .gauge-bg {
    width: 200px;
    height: 100px;
    border-radius: 100px 100px 0 0;
    background: conic-gradient(
      from 180deg at 50% 100%,
      var(--green) 0deg 60deg,
      var(--yellow) 60deg 120deg,
      var(--red) 120deg 180deg,
      transparent 180deg
    );
    position: relative;
    overflow: hidden;
  }
  .gauge-inner {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 65px;
    background: var(--surface);
    border-radius: 65px 65px 0 0;
  }
  .gauge-needle {
    position: absolute;
    bottom: 0; left: 50%;
    width: 2px;
    height: 82px;
    transform-origin: bottom center;
    background: linear-gradient(to top, transparent, var(--text));
    transition: transform 1.2s cubic-bezier(.4,0,.2,1);
    border-radius: 2px;
  }
  .gauge-needle-dot {
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--text);
  }

  .risk-badge {
    padding: 8px 22px;
    border-radius: 99px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
  .risk-low { background: rgba(76,175,125,0.2); color: var(--green); }
  .risk-med { background: rgba(240,192,64,0.2); color: var(--yellow); }
  .risk-high { background: rgba(224,92,92,0.2); color: var(--red); }

  .score-number {
    font-family: 'DM Serif Display', serif;
    font-size: 52px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .score-sub { font-size: 13px; color: var(--muted); }

  /* FACTORS PILLS */
  .factors-section {
    margin-bottom: 32px;
  }
  .factors-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }
  .factors-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .factor-pill {
    padding: 5px 13px;
    border-radius: 99px;
    font-size: 12.5px;
    border: 1px solid;
  }
  .pill-red { border-color: rgba(224,92,92,0.4); color: var(--red); background: rgba(224,92,92,0.08); }
  .pill-yellow { border-color: rgba(240,192,64,0.4); color: var(--yellow); background: rgba(240,192,64,0.08); }
  .pill-green { border-color: rgba(76,175,125,0.4); color: var(--green); background: rgba(76,175,125,0.08); }

  /* AI RECOMMENDATIONS */
  .ai-section {
    border-top: 1px solid var(--border);
    padding-top: 28px;
  }
  .ai-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .ai-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent2);
    animation: pulse 1.5s ease infinite;
  }
  .ai-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent2);
  }
  .ai-content {
    font-size: 14.5px;
    line-height: 1.75;
    color: #d0cfdf;
    white-space: pre-wrap;
    min-height: 60px;
  }
  .ai-loading {
    color: var(--muted);
    font-style: italic;
  }
  .cursor-blink {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--accent2);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s step-end infinite;
  }

  .btn-restart {
    margin-top: 32px;
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--muted);
    padding: 12px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .btn-restart:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }

  /* DISCLAIMER */
  .disclaimer {
    margin-top: 24px;
    padding: 14px 18px;
    background: rgba(255,255,255,0.03);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }

  /* ANIMATIONS */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(22px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-eyebrow">Evaluare clinică</div>
    <h1>Calculator Risc<br><em>Cardiovascular</em></h1>
    <p>Răspundeți la 10 întrebări despre stilul dvs. de viață și primiți o evaluare personalizată, completată cu recomandări generate de inteligență artificială.</p>
  </div>

  <div id="quiz-section">
    <div class="progress-label" id="progress-label">Întrebarea 1 din 10</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-bar" style="width:10%"></div>
    </div>
    <div class="card" id="question-card">
      <!-- rendered by JS -->
    </div>
  </div>

  <div id="result-section" style="display:none">
    <!-- rendered by JS -->
  </div>
</div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const WORKER_URL = "https://cardio-proxy.ruxandra-boghian.workers.dev/"; // Înlocuiți cu URL-ul real al Cloudflare Worker

// ─── QUESTIONS ─────────────────────────────────────────────────────────────
const questions = [
  {
    id: "age",
    icon: "🎂",
    text: "Care este grupa dvs. de vârstă?",
    options: [
      { label: "Sub 35 de ani",          score: 0, flag: null },
      { label: "35–44 de ani",           score: 1, flag: null },
      { label: "45–54 de ani",           score: 2, flag: "moderat" },
      { label: "55–64 de ani",           score: 3, flag: "ridicat" },
      { label: "65 de ani sau peste",    score: 4, flag: "ridicat" },
    ]
  },
  {
    id: "bp",
    icon: "🩺",
    text: "Care este tensiunea dvs. arterială sistolică (valoarea mare)?",
    options: [
      { label: "Sub 120 mmHg – normală",             score: 0, flag: null },
      { label: "120–129 mmHg – elevată",             score: 1, flag: null },
      { label: "130–139 mmHg – HTA stadiu 1",        score: 2, flag: "moderat" },
      { label: "140–159 mmHg – HTA stadiu 2",        score: 3, flag: "ridicat" },
      { label: "160 mmHg sau peste – HTA severă",    score: 4, flag: "ridicat" },
    ]
  },
  {
    id: "cholesterol",
    icon: "🧪",
    text: "Cum este colesterolul dvs. total (ultimul control)?",
    options: [
      { label: "Sub 200 mg/dL – optim",              score: 0, flag: null },
      { label: "200–239 mg/dL – la limită",          score: 2, flag: "moderat" },
      { label: "240 mg/dL sau peste – ridicat",      score: 3, flag: "ridicat" },
      { label: "Nu am fost niciodată controlat/ă",   score: 2, flag: "moderat" },
    ]
  },
  {
    id: "smoking",
    icon: "🚬",
    text: "Care este situația dvs. în privința fumatului?",
    options: [
      { label: "Nu fumez și nu am fumat niciodată",  score: 0, flag: null },
      { label: "Am renunțat acum mai mult de 5 ani", score: 1, flag: null },
      { label: "Am renunțat în ultimii 5 ani",       score: 2, flag: "moderat" },
      { label: "Fumez ocazional",                    score: 3, flag: "ridicat" },
      { label: "Fumez zilnic",                       score: 4, flag: "ridicat" },
    ]
  },
  {
    id: "diabetes",
    icon: "🩸",
    text: "Aveți diabet sau glicemie crescută?",
    options: [
      { label: "Nu, glicemia este normală",           score: 0, flag: null },
      { label: "Prediabet / glicemie la limită",      score: 2, flag: "moderat" },
      { label: "Diabet tip 2 controlat medicamentos", score: 3, flag: "ridicat" },
      { label: "Diabet tip 1 sau tip 2 necontrolat",  score: 4, flag: "ridicat" },
    ]
  },
  {
    id: "bmi",
    icon: "⚖️",
    text: "Cum v-ați descrie greutatea corporală (IMC)?",
    options: [
      { label: "Normal (IMC 18.5–24.9)",              score: 0, flag: null },
      { label: "Supraponderal (IMC 25–29.9)",         score: 1, flag: null },
      { label: "Obezitate gradul I (IMC 30–34.9)",    score: 2, flag: "moderat" },
      { label: "Obezitate gradul II–III (IMC ≥ 35)",  score: 3, flag: "ridicat" },
    ]
  },
  {
    id: "activity",
    icon: "🏃",
    text: "Cât de activ/ă fizic ești în mod obișnuit?",
    options: [
      { label: "Activ/ă zilnic – sport sau mers >30 min/zi", score: 0, flag: null },
      { label: "Moderat activ/ă – 3–4 ori pe săptămână",     score: 1, flag: null },
      { label: "Rar activ/ă – 1–2 ori pe săptămână",         score: 2, flag: "moderat" },
      { label: "Sedentar/ă – aproape deloc mișcare fizică",  score: 3, flag: "ridicat" },
    ]
  },
  {
    id: "stress",
    icon: "🧠",
    text: "Cum ați descrie nivelul dvs. de stres cronic?",
    options: [
      { label: "Redus – gestionez bine stresul",             score: 0, flag: null },
      { label: "Moderat – stres ocazional, gestionabil",     score: 1, flag: null },
      { label: "Ridicat – stres frecvent, dificil de gestionat", score: 2, flag: "moderat" },
      { label: "Foarte ridicat – burnout sau anxietate cronică",  score: 3, flag: "ridicat" },
    ]
  },
  {
    id: "family",
    icon: "👨‍👩‍👧",
    text: "Există antecedente de boli cardiovasculare în familia dvs.?",
    options: [
      { label: "Nu, niciun antecedent relevant",                      score: 0, flag: null },
      { label: "Rude de gradul II (bunici, unchi)",                   score: 1, flag: null },
      { label: "Rude de gradul I (părinți, frați) – vârstă > 55 ani", score: 2, flag: "moderat" },
      { label: "Rude de gradul I cu boală cardiovasculară precoce",   score: 3, flag: "ridicat" },
    ]
  },
  {
    id: "diet",
    icon: "🥗",
    text: "Cum ați descrie dieta și somnul dvs.?",
    options: [
      { label: "Dietă echilibrată + somn 7–8h regulat",               score: 0, flag: null },
      { label: "Dietă oarecum sănătoasă + somn 6–7h",                 score: 1, flag: null },
      { label: "Multă procesată/grăsimi saturate + somn 5–6h",        score: 2, flag: "moderat" },
      { label: "Dietă nesănătoasă + somn sub 5h sau insomnie",        score: 3, flag: "ridicat" },
    ]
  },
];

// ─── STATE ──────────────────────────────────────────────────────────────────
let current = 0;
let answers = new Array(questions.length).fill(null);

// ─── RENDER QUESTION ────────────────────────────────────────────────────────
function renderQuestion() {
  const q = questions[current];
  const pct = ((current + 1) / questions.length) * 100;
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-label").textContent =
    `Întrebarea ${current + 1} din ${questions.length}`;

  const card = document.getElementById("question-card");
  card.style.animation = "none";
  card.offsetHeight; // reflow
  card.style.animation = "";

  card.innerHTML = `
    <div class="question-number">Întrebarea ${current + 1}</div>
    <span class="question-icon">${q.icon}</span>
    <div class="question-text">${q.text}</div>
    <div class="options" id="options-list">
      ${q.options.map((opt, i) => `
        <button class="option ${answers[current] === i ? "selected" : ""}"
          onclick="selectOption(${i})">
          <span class="option-dot"></span>
          ${opt.label}
        </button>
      `).join("")}
    </div>
    <div class="nav">
      ${current > 0
        ? `<button class="btn btn-back" onclick="goBack()">← Înapoi</button>`
        : `<span></span>`}
      <button class="btn btn-next" id="btn-next"
        onclick="goNext()"
        ${answers[current] === null ? "disabled" : ""}>
        ${current === questions.length - 1 ? "Calculează riscul →" : "Continuă →"}
      </button>
    </div>
  `;
}

function selectOption(idx) {
  answers[current] = idx;
  renderQuestion();
}

function goBack() {
  if (current > 0) { current--; renderQuestion(); }
}

function goNext() {
  if (answers[current] === null) return;
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showResults();
  }
}

// ─── RESULTS ────────────────────────────────────────────────────────────────
function calcScore() {
  let total = 0;
  questions.forEach((q, i) => {
    if (answers[i] !== null) total += q.options[answers[i]].score;
  });
  return total;
}

function getRiskLevel(score) {
  if (score <= 8)  return { level: "scăzut",  cls: "risk-low",  color: "var(--green)",  angle: -70 };
  if (score <= 17) return { level: "moderat",  cls: "risk-med",  color: "var(--yellow)", angle: 0   };
  return              { level: "ridicat",  cls: "risk-high", color: "var(--red)",    angle: 70  };
}

function buildAnswerSummary() {
  return questions.map((q, i) => {
    const opt = q.options[answers[i]];
    return `${q.icon} ${q.text.replace(/\?$/, "")}: ${opt.label} (risc: ${opt.flag || "scăzut"})`;
  }).join("\n");
}

function buildFactors() {
  const pills = [];
  questions.forEach((q, i) => {
    if (answers[i] !== null) {
      const opt = q.options[answers[i]];
      const cls = opt.flag === "ridicat" ? "pill-red" : opt.flag === "moderat" ? "pill-yellow" : "pill-green";
      const names = {age:"Vârstă",bp:"Tensiune",cholesterol:"Colesterol",smoking:"Fumat",
                     diabetes:"Diabet",bmi:"Greutate",activity:"Activitate",stress:"Stres",
                     family:"Antecedente familiale",diet:"Dietă & Somn"};
      pills.push(`<span class="factor-pill ${cls}">${names[q.id]}</span>`);
    }
  });
  return pills.join("");
}

function showResults() {
  const score = calcScore();
  const maxScore = questions.reduce((s, q) => s + Math.max(...q.options.map(o => o.score)), 0);
  const pct = Math.round((score / maxScore) * 100);
  const risk = getRiskLevel(score);

  document.getElementById("quiz-section").style.display = "none";
  const rs = document.getElementById("result-section");
  rs.style.display = "block";

  rs.innerHTML = `
    <div class="result-card">
      <div class="risk-display">
        <div class="risk-label-top">Scor total: ${score} / ${maxScore} puncte (${pct}%)</div>
        <div class="gauge-wrap">
          <div class="gauge-bg">
            <div class="gauge-inner"></div>
          </div>
          <div class="gauge-needle" id="gauge-needle" style="transform: translateX(-50%) rotate(-90deg)">
            <div class="gauge-needle-dot"></div>
          </div>
        </div>
        <div class="score-number" style="color:${risk.color}">${score}</div>
        <div class="score-sub">puncte din ${maxScore}</div>
        <div class="risk-badge ${risk.cls}" style="margin-top:14px">
          Risc cardiovascular ${risk.level.toUpperCase()}
        </div>
      </div>

      <div class="factors-section">
        <div class="factors-title">Profilul factorilor de risc</div>
        <div class="factors-grid">${buildFactors()}</div>
      </div>

      <div class="ai-section">
        <div class="ai-header">
          <div class="ai-dot"></div>
          <div class="ai-label">Recomandări personalizate · Claude AI</div>
        </div>
        <div class="ai-content ai-loading" id="ai-content">
          Se generează recomandările personalizate...<span class="cursor-blink"></span>
        </div>
      </div>

      <div class="disclaimer">
        ⚠️ <strong>Notă:</strong> Acest calculator are scop educațional și nu înlocuiește consultul medical. Adresați-vă medicului cardiolog pentru o evaluare completă.
      </div>

      <button class="btn-restart" onclick="restart()">↺ Reia evaluarea de la început</button>
    </div>
  `;

  // Animate needle after render
  setTimeout(() => {
    const needle = document.getElementById("gauge-needle");
    if (needle) needle.style.transform = `translateX(-50%) rotate(${risk.angle}deg)`;
  }, 100);

  // Fetch AI recommendations via streaming
  fetchAIRecommendations(score, risk.level);
}

// ─── STREAMING AI ───────────────────────────────────────────────────────────
async function fetchAIRecommendations(score, riskLevel) {
  const aiDiv = document.getElementById("ai-content");

  const systemPrompt = `Ești un medic cardiolog expert, empatic și clar în comunicare. 
Generezi recomandări medicale personalizate în limba română, bazate pe profilul de risc cardiovascular al pacientului. 
Fii concret, practic și motivant. Structurează răspunsul în secțiuni clare. Nu folosi asteriscuri sau markdown, scrie text curat.`;

  const userPrompt = `Pacientul a completat un chestionar de evaluare a riscului cardiovascular.

Scor total: ${score} puncte → Risc ${riskLevel}

Răspunsurile detaliate:
${buildAnswerSummary()}

Te rog să generezi:
1. O scurtă interpretare a profilului de risc (2-3 fraze)
2. Recomandări prioritare pentru reducerea riscului (5-7 puncte concrete, adaptate exact la răspunsurile de mai sus)
3. Obiective pe termen scurt (30 de zile) și pe termen lung (6-12 luni)
4. Un mesaj de încurajare personalizat

Scrie direct și natural, fără formatare markdown, ca și cum ai vorbi cu pacientul.`;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1024,
        stream: true,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    aiDiv.classList.remove("ai-loading");
    aiDiv.innerHTML = '<span class="cursor-blink"></span>';
    let fullText = "";

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split("\n");

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const data = line.slice(6).trim();
        if (data === "[DONE]") continue;
        try {
          const parsed = JSON.parse(data);
          const delta = parsed?.delta?.text || parsed?.choices?.[0]?.delta?.content || "";
          if (delta) {
            fullText += delta;
            aiDiv.innerHTML = escapeHTML(fullText) + '<span class="cursor-blink"></span>';
          }
        } catch (_) {}
      }
    }

    // Remove cursor when done
    aiDiv.innerHTML = escapeHTML(fullText);

  } catch (err) {
    aiDiv.classList.remove("ai-loading");
    if (WORKER_URL === "WORKER_URL_AICI") {
      aiDiv.innerHTML = `<span style="color:var(--yellow)">⚙️ Worker URL nesetat. Înlocuiți "WORKER_URL_AICI" din cod cu URL-ul Cloudflare Worker-ului dvs. pentru a activa recomandările AI.</span>`;
    } else {
      aiDiv.innerHTML = `<span style="color:var(--red)">⚠️ Eroare la generarea recomandărilor: ${escapeHTML(err.message)}</span>`;
    }
  }
}

function escapeHTML(str) {
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function restart() {
  current = 0;
  answers = new Array(questions.length).fill(null);
  document.getElementById("result-section").style.display = "none";
  document.getElementById("quiz-section").style.display = "block";
  renderQuestion();
}

// ─── INIT ───────────────────────────────────────────────────────────────────
renderQuestion();
</script>
